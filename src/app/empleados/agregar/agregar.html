<div class="container mt-4">
  <h2 class="mb-4">Agregar Empleado</h2>
  
  <form (ngSubmit)="guardarEmpleado()">
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" class="form-control" id="nombre" [(ngModel)]="empleado.nombre" name="nombre" required>
    </div>
    
    <div class="mb-3">
      <label for="departamento" class="form-label">Departamento</label>
      <input type="text" class="form-control" id="departamento" [(ngModel)]="empleado.departamento" name="departamento" required>
    </div>
    
    <div class="mb-3">
      <label for="sueldo" class="form-label">Sueldo</label>
      <input type="number" class="form-control" id="sueldo" [(ngModel)]="empleado.sueldo" name="sueldo" required>
    </div>
    
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <button type="button" class="btn btn-secondary" (click)="volver()">Cancelar</button>
    </div>
  </form>
</div>
