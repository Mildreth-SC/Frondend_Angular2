<div class="container mt-4">
  <h2 class="mb-3">Listado de Empleados</h2>

  <table class="table table-dark table-striped table-hover">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Departamento</th>
        <th>Sueldo</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (emp of empleados(); track emp.idEmpleado) {
        <tr>
          <td>{{ emp.idEmpleado }}</td>
          <td>{{ emp.nombre }}</td>
          <td>{{ emp.departamento }}</td>
          <td>{{ emp.sueldo | currency }}</td>
          <td>
            <button class="btn btn-warning btn-sm me-2" (click)="editarEmpleado(emp.idEmpleado)">
              <i class="bi bi-pencil"></i> Editar
            </button>
            <button class="btn btn-danger btn-sm" (click)="eliminarEmpleado(emp.idEmpleado)">
              <i class="bi bi-trash"></i> Eliminar
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
